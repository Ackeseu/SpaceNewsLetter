# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - newspace-newsletter-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          mkdir -p release
          cp -R dist release/dist
          cp -R public release/public
          cp -R node_modules release/node_modules
          cp package.json package-lock.json release/
          if [ -f web.config ]; then cp web.config release/; fi
          cd release
          zip -r ../release.zip .

      - name: Install Azure Functions dependencies
        working-directory: azure-functions
        run: npm ci

      - name: Build Azure Functions TypeScript
        working-directory: azure-functions
        run: npm run build

      - name: Keep Azure Functions production dependencies only
        working-directory: azure-functions
        run: npm prune --omit=dev

      - name: Create Azure Functions deployment package
        run: |
          mkdir -p functions-release
          cp -R azure-functions/dist functions-release/dist
          cp -R azure-functions/NewsAggregator functions-release/NewsAggregator
          cp -R azure-functions/PipelineMonitor functions-release/PipelineMonitor
          cp -R azure-functions/SendNewsletter functions-release/SendNewsletter
          cp -R azure-functions/node_modules functions-release/node_modules
          cp azure-functions/package.json azure-functions/package-lock.json azure-functions/host.json functions-release/
          cd functions-release
          zip -r ../functions-release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

      - name: Upload Azure Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-app
          path: functions-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifacts

      - name: Download Azure Functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-app
          path: functions-artifacts
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9B4A83214E3141E9A6F1FE30DF899A3B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE46BC94503E44DC883D8334622D1D4B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C957B894AEA465D89A2E62B7DAD9C9D }}

      - name: Deploy ZIP via Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group newspace-newsletter-rg \
              --name newspace-newsletter-api \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

            ZIP_PATH=$(find artifacts -type f -name 'release.zip' | head -n 1)
            if [ -z "$ZIP_PATH" ]; then
              echo "release.zip not found under artifacts"
              find artifacts -maxdepth 4 -type f
              exit 1
            fi

            echo "Deploying package: $ZIP_PATH"
            az webapp deployment source config-zip \
              --resource-group newspace-newsletter-rg \
              --name newspace-newsletter-api \
              --src "$ZIP_PATH"

            FUNCTIONS_ZIP_PATH=$(find functions-artifacts -type f -name 'functions-release.zip' | head -n 1)
            if [ -z "$FUNCTIONS_ZIP_PATH" ]; then
              echo "functions-release.zip not found under functions-artifacts"
              find functions-artifacts -maxdepth 4 -type f
              exit 1
            fi

            echo "Deploying Azure Functions package: $FUNCTIONS_ZIP_PATH"
            az functionapp deployment source config-zip \
              --resource-group newspace-newsletter-rg \
              --name newspacenewsletter-func \
              --src "$FUNCTIONS_ZIP_PATH"
          