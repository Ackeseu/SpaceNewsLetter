<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NewSpace Newsletter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="password"],
    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      background-color: #f8f9ff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* Admin Dashboard Styles */
    .dashboard {
      display: none;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border: 1px solid white;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #999;
      margin-bottom: 10px;
    }

    .stat-card .number {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
    }

    .form-card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    .form-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .subscribers-table {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f8f9ff;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      font-weight: 600;
      color: #333;
    }

    tr:hover {
      background: #f8f9ff;
    }

    .action-btn {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .edit-btn {
      background: #667eea;
      color: white;
    }

    .edit-btn:hover {
      background: #5568d3;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-verified {
      background: #d4edda;
      color: #155724;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-inactive {
      background: #f8d7da;
      color: #721c24;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 28px;
      color: #999;
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
    }

    .checkbox-item input[type="checkbox"] {
      margin-right: 8px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-item label {
      margin: 0;
      cursor: pointer;
      font-weight: 400;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
      }

      .tabs {
        flex-wrap: wrap;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 10px;
      }

      .action-btn {
        display: block;
        width: 100%;
        margin-bottom: 5px;
      }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <h1>🔐 Admin Login</h1>
      <div class="message" id="loginMessage"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminToken">Admin Token</label>
          <input type="password" id="adminToken" placeholder="Enter admin token" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>📊 Admin Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="content">
      <div class="message" id="dashMessage"></div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('subscribers')">Subscribers</button>
        <button class="tab-btn" onclick="switchTab('add')">Add Subscriber</button>
        <button class="tab-btn" onclick="switchTab('preferences')">Edit Preferences</button>
      </div>

      <!-- Subscribers Tab -->
      <div id="subscribers" class="tab-content active">
        <div class="subscribers-table" id="subscribersTable">
          <div class="loading"><span class="spinner"></span>Loading subscribers...</div>
        </div>
      </div>

      <!-- Add Subscriber Tab -->
      <div id="add" class="tab-content">
        <div class="form-card">
          <h2>Add New Subscriber</h2>
          <form id="addForm">
            <div class="form-row">
              <div class="form-group">
                <label for="newEmail">Email *</label>
                <input type="email" id="newEmail" required>
              </div>
              <div class="form-group">
                <label for="newFirstName">First Name</label>
                <input type="text" id="newFirstName">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="newLastName">Last Name</label>
                <input type="text" id="newLastName">
              </div>
              <div class="form-group">
                <label for="newFrequency">Frequency</label>
                <select id="newFrequency">
                  <option value="daily">Daily</option>
                  <option value="weekly" selected>Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Topics (select at least one)</label>
              <div class="checkbox-group">
                <div class="checkbox-item">
                  <input type="checkbox" id="newTopic1" value="business">
                  <label for="newTopic1">Business</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newTopic2" value="launches">
                  <label for="newTopic2">Launches</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newTopic3" value="policy">
                  <label for="newTopic3">Policy</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newTopic4" value="technology">
                  <label for="newTopic4">Technology</label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label>Regions (select at least one)</label>
              <div class="checkbox-group">
                <div class="checkbox-item">
                  <input type="checkbox" id="newRegion1" value="global">
                  <label for="newRegion1">Global</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newRegion2" value="asia">
                  <label for="newRegion2">Asia</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newRegion3" value="china">
                  <label for="newRegion3">China</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="newRegion4" value="hong-kong">
                  <label for="newRegion4">Hong Kong</label>
                </div>
              </div>
            </div>

            <button type="submit" style="margin-top: 20px;">Add Subscriber</button>
          </form>
        </div>
      </div>

      <!-- Edit Preferences Tab -->
      <div id="preferences" class="tab-content">
        <div class="form-card">
          <h2>Edit Subscriber Preferences</h2>
          <div class="form-group">
            <label for="prefEmail">Select Subscriber Email</label>
            <select id="prefEmail">
              <option value="">Loading...</option>
            </select>
          </div>
          <form id="prefForm" style="display: none;">
            <div class="form-group">
              <label for="prefFrequency">Frequency</label>
              <select id="prefFrequency">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>

            <div class="form-group">
              <label>Topics</label>
              <div class="checkbox-group">
                <div class="checkbox-item">
                  <input type="checkbox" class="prefTopic" value="business">
                  <label>Business</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefTopic" value="launches">
                  <label>Launches</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefTopic" value="policy">
                  <label>Policy</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefTopic" value="technology">
                  <label>Technology</label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label>Regions</label>
              <div class="checkbox-group">
                <div class="checkbox-item">
                  <input type="checkbox" class="prefRegion" value="global">
                  <label>Global</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefRegion" value="asia">
                  <label>Asia</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefRegion" value="china">
                  <label>China</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" class="prefRegion" value="hong-kong">
                  <label>Hong Kong</label>
                </div>
              </div>
            </div>

            <button type="submit" style="margin-top: 20px;">Update Preferences</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content" style="position: relative;">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-header">Edit Subscriber</div>
      <form id="editForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editEmail" readonly style="background: #f0f0f0; cursor: not-allowed;">
        </div>
        <div class="form-group">
          <label for="editFirstName">First Name</label>
          <input type="text" id="editFirstName">
        </div>
        <div class="form-group">
          <label for="editFrequency">Frequency</label>
          <select id="editFrequency">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin === 'file://' 
      ? 'https://newspace-newsletter-api.azurewebsites.net' 
      : window.location.origin;

    let adminToken = localStorage.getItem('adminToken');
    let allSubscribers = [];

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('adminToken').value;
      adminToken = token;
      localStorage.setItem('adminToken', token);
      
      // Try to fetch stats to verify token
      try {
        const response = await fetch(`${API_URL}/api/subscriptions/stats`, {
          headers: { 'x-admin-token': token }
        });
        
        if (response.ok) {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadDashboard();
        } else {
          showMessage('loginMessage', 'Invalid token', 'error');
        }
      } catch (error) {
        showMessage('loginMessage', 'Connection error', 'error');
      }
    });

    async function loadDashboard() {
      await loadStats();
      await loadSubscribers();
      await loadPrefEmails();
    }

    async function loadStats() {
      try {
        const response = await fetch(`${API_URL}/api/subscriptions/stats`, {
          headers: { 'x-admin-token': adminToken }
        });
        const data = await response.json();
        
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card">
            <h3>Total Subscribers</h3>
            <div class="number">${data.total || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Active</h3>
            <div class="number">${data.active || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Verified</h3>
            <div class="number">${data.verified || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Unsubscribed</h3>
            <div class="number">${data.unsubscribed || 0}</div>
          </div>
        `;
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    async function loadSubscribers() {
      try {
        const response = await fetch(`${API_URL}/api/subscriptions/admin/list`, {
          headers: { 'x-admin-token': adminToken }
        });
        
        if (!response.ok) {
          document.getElementById('subscribersTable').innerHTML = '<p style="padding: 20px;">Error loading subscribers</p>';
          return;
        }

        allSubscribers = await response.json();
        
        const table = `
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Status</th>
                <th>Frequency</th>
                <th>Topics</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${allSubscribers.map(sub => `
                <tr>
                  <td>${sub.email}</td>
                  <td>${(sub.firstName || '') + ' ' + (sub.lastName || '')}</td>
                  <td>
                    ${sub.isVerified 
                      ? '<span class="status-badge status-verified">Verified</span>' 
                      : '<span class="status-badge status-pending">Pending</span>'}
                    ${!sub.isActive ? '<br><span class="status-badge status-inactive">Inactive</span>' : ''}
                  </td>
                  <td>${sub.frequency || 'weekly'}</td>
                  <td>${(sub.topics || []).join(', ') || '-'}</td>
                  <td>
                    <button class="action-btn edit-btn" onclick="editSubscriber('${sub.id}')">Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteSubscriber('${sub.email}')">Remove</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('subscribersTable').innerHTML = table;
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('subscribersTable').innerHTML = '<p style="padding: 20px;">Error loading subscribers</p>';
      }
    }

    async function loadPrefEmails() {
      const select = document.getElementById('prefEmail');
      select.innerHTML = allSubscribers.length > 0 
        ? allSubscribers.map(s => `<option value="${s.email}">${s.email}</option>`).join('')
        : '<option>No subscribers</option>';
      
      if (allSubscribers.length > 0) {
        select.addEventListener('change', (e) => {
          if (e.target.value) {
            showPrefForm(e.target.value);
          }
        });
      }
    }

    function editSubscriber(id) {
      const sub = allSubscribers.find(s => s.id == id);
      if (sub) {
        document.getElementById('editEmail').value = sub.email;
        document.getElementById('editFirstName').value = sub.firstName || '';
        document.getElementById('editFrequency').value = sub.frequency || 'weekly';
        document.getElementById('editModal').classList.add('show');
      }
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('show');
    }

    async function deleteSubscriber(email) {
      if (confirm(`Remove ${email} from subscribers?`)) {
        const sub = allSubscribers.find(s => s.email === email);
        if (sub && sub.unsubscribeToken) {
          try {
            await fetch(`${API_URL}/api/subscriptions/unsubscribe/${sub.unsubscribeToken}`);
            showMessage('dashMessage', 'Subscriber removed', 'success');
            loadSubscribers();
          } catch (error) {
            showMessage('dashMessage', 'Error removing subscriber', 'error');
          }
        }
      }
    }

    function showPrefForm(email) {
      const sub = allSubscribers.find(s => s.email === email);
      if (sub) {
        document.getElementById('prefForm').style.display = 'block';
        document.getElementById('prefFrequency').value = sub.frequency || 'weekly';
        
        document.querySelectorAll('.prefTopic').forEach(cb => {
          cb.checked = (sub.topics || []).includes(cb.value);
        });
        
        document.querySelectorAll('.prefRegion').forEach(cb => {
          cb.checked = (sub.regions || []).includes(cb.value);
        });
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function showMessage(elementId, text, type) {
      const msg = document.getElementById(elementId);
      msg.textContent = text;
      msg.className = `message show ${type}`;
      setTimeout(() => msg.classList.remove('show'), 5000);
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    // Add Subscriber Form
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const topics = Array.from(document.querySelectorAll('input[id^="newTopic"]:checked')).map(cb => cb.value);
      const regions = Array.from(document.querySelectorAll('input[id^="newRegion"]:checked')).map(cb => cb.value);

      try {
        const response = await fetch(`${API_URL}/api/subscriptions/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('newEmail').value,
            firstName: document.getElementById('newFirstName').value,
            lastName: document.getElementById('newLastName').value,
            frequency: document.getElementById('newFrequency').value,
            topics: topics.length > 0 ? topics : ['general'],
            regions: regions.length > 0 ? regions : ['global']
          })
        });

        if (response.ok) {
          showMessage('dashMessage', 'Subscriber added successfully', 'success');
          document.getElementById('addForm').reset();
          loadSubscribers();
          loadPrefEmails();
        } else {
          const error = await response.json();
          showMessage('dashMessage', error.error || 'Failed to add subscriber', 'error');
        }
      } catch (error) {
        showMessage('dashMessage', 'Error adding subscriber', 'error');
      }
    });

    // Preferences Form
    document.getElementById('prefForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('prefEmail').value;
      const sub = allSubscribers.find(s => s.email === email);
      
      if (!sub || !sub.preferencesToken) {
        showMessage('dashMessage', 'Cannot update preferences - token missing', 'error');
        return;
      }

      const topics = Array.from(document.querySelectorAll('.prefTopic:checked')).map(cb => cb.value);
      const regions = Array.from(document.querySelectorAll('.prefRegion:checked')).map(cb => cb.value);

      try {
        const response = await fetch(`${API_URL}/api/subscriptions/preferences/${sub.preferencesToken}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            frequency: document.getElementById('prefFrequency').value,
            topics: topics.length > 0 ? topics : ['general'],
            regions: regions.length > 0 ? regions : ['global']
          })
        });

        if (response.ok) {
          showMessage('dashMessage', 'Preferences updated', 'success');
          loadSubscribers();
        } else {
          showMessage('dashMessage', 'Failed to update preferences', 'error');
        }
      } catch (error) {
        showMessage('dashMessage', 'Error updating preferences', 'error');
      }
    });

    // Check if already logged in
    if (adminToken) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }
  </script>
</body>
</html>
