<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewSpace Newsletter - Subscribe Today</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }

    .rocket-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      background-color: #f8f9ff;
    }

    .topics-group {
      margin-bottom: 20px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .checkbox-wrapper input[type="checkbox"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .checkbox-wrapper label {
      margin: 0;
      cursor: pointer;
      font-weight: 400;
      color: #555;
    }

    .frequency-options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .frequency-options label {
      margin: 0;
    }

    .frequency-options input[type="radio"] {
      margin-right: 6px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .radio-label {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .radio-label:hover {
      border-color: #667eea;
      background-color: #f8f9ff;
    }

    .radio-label input[type="radio"]:checked {
      accent-color: #667eea;
    }

    .radio-label input[type="radio"]:checked + span {
      color: #667eea;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      text-align: center;
      display: none;
      font-weight: 500;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: 600;
      margin-top: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #999;
      font-size: 12px;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .frequency-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="rocket-icon">🚀</div>
      <h1>NewSpace Newsletter</h1>
      <p>Stay updated with the latest in space exploration and the low-altitude economy</p>
    </div>

    <form id="subscriptionForm">
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="John">
      </div>

      <div class="form-group">
        <label for="frequency">Newsletter Frequency *</label>
        <div class="frequency-options">
          <div class="radio-label">
            <input type="radio" id="daily" name="frequency" value="daily">
            <span>Daily</span>
          </div>
          <div class="radio-label">
            <input type="radio" id="weekly" name="frequency" value="weekly" checked>
            <span>Weekly</span>
          </div>
          <div class="radio-label">
            <input type="radio" id="monthly" name="frequency" value="monthly">
            <span>Monthly</span>
          </div>
        </div>
      </div>

      <div class="topics-group">
        <label>Interests</label>
        <div class="checkbox-wrapper">
          <input type="checkbox" id="topic1" name="topics" value="space exploration" checked>
          <label for="topic1">Space Exploration</label>
        </div>
        <div class="checkbox-wrapper">
          <input type="checkbox" id="topic2" name="topics" value="launches">
          <label for="topic2">Launches & Missions</label>
        </div>
        <div class="checkbox-wrapper">
          <input type="checkbox" id="topic3" name="topics" value="astronomy">
          <label for="topic3">Astronomy</label>
        </div>
        <div class="checkbox-wrapper">
          <input type="checkbox" id="topic4" name="topics" value="space economy">
          <label for="topic4">Space Economy</label>
        </div>
        <div class="checkbox-wrapper">
          <input type="checkbox" id="topic5" name="topics" value="satellite news">
          <label for="topic5">Satellite News</label>
        </div>
      </div>

      <button type="submit">Subscribe Now</button>

      <div class="loading" id="loading">
        <span class="spinner"></span>
        Subscribing...
      </div>

      <div class="message" id="message"></div>
    </form>

    <div class="footer">
      <p>We respect your privacy. Unsubscribe anytime from any email.</p>
      <p><a href="https://newspace-newsletter-api.azurewebsites.net/health">API Status</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('subscriptionForm');
    const messageDiv = document.getElementById('message');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const firstName = document.getElementById('firstName').value;
      const frequency = document.querySelector('input[name="frequency"]:checked').value;
      const topics = Array.from(document.querySelectorAll('input[name="topics"]:checked'))
        .map(cb => cb.value);

      // Show loading state
      loadingDiv.classList.add('active');
      messageDiv.className = 'message';
      messageDiv.textContent = '';

      try {
        const response = await fetch('/api/subscriptions/subscribe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email,
            firstName: firstName || undefined,
            frequency,
            topics: topics.length > 0 ? topics : ['general']
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Redirect to thank you page after 1 second
          setTimeout(() => {
            window.location.href = '/thank-you.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '✗ ' + (data.error || 'Subscription failed. Please try again.');
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '✗ Network error. Please try again.';
        console.error('Error:', error);
      } finally {
        loadingDiv.classList.remove('active');
      }
    });
  </script>
</body>
</html>
